modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="${create_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="apotheosis"
type="required"
versionRange="${apotheosis_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="apothic_attributes"
type="required"
versionRange="[1.6,)"
ordering="AFTER"
side="BOTH"
